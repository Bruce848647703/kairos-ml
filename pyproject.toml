[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos-ml"
version = "0.1.0"
description = "Kairos ML —— 面向金融机器学习的 numpy 自研工具库（特征/标签/时序CV/模型/评估）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Bruce848647703" }]
keywords = ["quant", "machine-learning", "finance", "numpy", "triple-barrier", "purged-cv"]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
scipy = ["scipy>=1.7"]

[tool.setuptools]
packages = ["kairos_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
